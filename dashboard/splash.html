<!doctype html>
<meta charset="utf-8">
<title>Nightcrew splash</title>
<style>body{margin:0;background:#04060f}</style>
<!-- Standalone preview wrapper ends here. server.py injects everything
     below the marker into the board page (prefixed with a script that
     sets window.NC_EMBED=1). Opened directly, the animation loops
     forever and never dismisses - that is the preview mode. -->
<!-- NC-SPLASH-START -->
<style>
#nc-splash{position:fixed;inset:0;z-index:999;cursor:pointer;margin:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:linear-gradient(180deg,#04060f 0%,#0a0f22 55%,#101731 100%);
  transition:opacity .6s ease}
#nc-splash svg{width:min(92vw,840px);height:auto;display:block}
#nc-splash .nc-star{animation:ncspTwinkle 3.2s ease-in-out infinite}
@keyframes ncspTwinkle{0%,100%{opacity:.9}50%{opacity:.15}}
#nc-splash .nc-shoot{opacity:0;animation:ncspShoot 7s linear 2.4s infinite}
@keyframes ncspShoot{0%,93%{opacity:0;transform:translate(110px,52px) rotate(17deg)}
  95%{opacity:.9}100%{opacity:0;transform:translate(470px,165px) rotate(17deg)}}
#nc-splash .nc-smoke{animation:ncspRise 3.8s ease-out infinite;
  transform-box:fill-box;transform-origin:center}
@keyframes ncspRise{0%{transform:translateY(0) scale(.55);opacity:.4}
  70%{opacity:.18}100%{transform:translateY(-95px) scale(1.7);opacity:0}}
#nc-splash .nc-beacon{animation:ncspPulse 1.8s ease-in-out infinite}
@keyframes ncspPulse{0%,100%{opacity:1}50%{opacity:.15}}
#nc-splash .nc-w{animation:ncspWin 3.4s ease-in-out infinite}
@keyframes ncspWin{0%,100%{opacity:.85}50%{opacity:.5}}
#nc-splash .nc-woff{animation:ncspWinOff 6.5s step-end infinite}
@keyframes ncspWinOff{0%,100%{opacity:.8}44%{opacity:.08}52%{opacity:.8}}
#nc-splash .nc-wheel{animation:ncspSpin 2.4s linear infinite;
  transform-box:fill-box;transform-origin:center}
@keyframes ncspSpin{to{transform:rotate(360deg)}}
#nc-splash .nc-crates{animation:ncspBelt 3.4s linear infinite}
@keyframes ncspBelt{to{transform:translateX(250px)}}
#nc-splash .nc-sign{font:700 34px ui-monospace,Menlo,Consolas,monospace;
  letter-spacing:12px;fill:#ffd98a;
  text-shadow:0 0 8px rgba(232,179,75,.9),0 0 26px rgba(232,179,75,.5),
    0 0 60px rgba(232,179,75,.3);
  animation:ncspNeon 4.6s linear infinite}
@keyframes ncspNeon{0%,100%{opacity:1}7%{opacity:.55}8%{opacity:1}
  46%{opacity:1}47%{opacity:.35}49%{opacity:1}82%{opacity:1}83%{opacity:.7}84%{opacity:1}}
#nc-splash .nc-tag{font:13px/1 ui-monospace,Menlo,Consolas,monospace;color:#e8b34b;
  letter-spacing:.25em;white-space:nowrap;overflow:hidden;width:0;margin:0;
  border-right:2px solid rgba(232,179,75,.8);padding:2px 2px 2px 0;
  animation:ncspType 2s steps(23) .8s forwards,ncspBlink 1.1s step-end infinite}
@keyframes ncspType{to{width:calc(23ch + 5.9em)}}
@keyframes ncspBlink{50%{border-color:transparent}}
#nc-splash .nc-hint{display:none;position:absolute;bottom:18px;right:22px;margin:0;
  font:11px ui-monospace,Menlo,Consolas,monospace;color:#4a5578;letter-spacing:.12em}
#nc-splash.nc-embed .nc-hint{display:block}
</style>
<div id="nc-splash">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" aria-label="A factory working through the night">
  <defs>
    <linearGradient id="ncspShootG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ncspFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f22" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0f22" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="ncspBeltClip"><rect x="90" y="396" width="720" height="46"/></clipPath>
  </defs>

  <!-- stars -->
  <g fill="#cdd8f4">
    <circle class="nc-star" cx="60"  cy="60"  r="1.4"/>
    <circle class="nc-star" cx="130" cy="120" r="1.1" style="animation-delay:-.7s"/>
    <circle class="nc-star" cx="205" cy="45"  r="1.5" style="animation-delay:-1.9s"/>
    <circle class="nc-star" cx="280" cy="95"  r="1.0" style="animation-delay:-1.1s"/>
    <circle class="nc-star" cx="345" cy="55"  r="1.3" style="animation-delay:-2.6s"/>
    <circle class="nc-star" cx="420" cy="130" r="1.1" style="animation-delay:-.4s"/>
    <circle class="nc-star" cx="470" cy="70"  r="1.5" style="animation-delay:-1.5s"/>
    <circle class="nc-star" cx="545" cy="40"  r="1.2" style="animation-delay:-2.2s"/>
    <circle class="nc-star" cx="600" cy="110" r="1.0" style="animation-delay:-.9s"/>
    <circle class="nc-star" cx="660" cy="60"  r="1.4" style="animation-delay:-1.7s"/>
    <circle class="nc-star" cx="845" cy="45"  r="1.2" style="animation-delay:-2.9s"/>
    <circle class="nc-star" cx="870" cy="150" r="1.1" style="animation-delay:-1.3s"/>
    <circle class="nc-star" cx="30"  cy="170" r="1.0" style="animation-delay:-2.1s"/>
    <circle class="nc-star" cx="500" cy="155" r=".9"  style="animation-delay:-.2s"/>
  </g>
  <rect class="nc-shoot" width="70" height="2" rx="1" fill="url(#ncspShootG)"/>

  <!-- moon -->
  <circle cx="762" cy="92" r="62" fill="#f4ecd8" opacity=".05"/>
  <circle cx="762" cy="92" r="47" fill="#f4ecd8" opacity=".09"/>
  <circle cx="762" cy="92" r="33" fill="#f2ead4"/>
  <circle cx="750" cy="84" r="5.5" fill="#ded4bb" opacity=".7"/>
  <circle cx="773" cy="102" r="4" fill="#ded4bb" opacity=".6"/>
  <circle cx="766" cy="78" r="2.6" fill="#ded4bb" opacity=".5"/>

  <!-- chimney smoke -->
  <g fill="#8ea3cf">
    <circle class="nc-smoke" cx="256" cy="122" r="9"/>
    <circle class="nc-smoke" cx="252" cy="118" r="7"  style="animation-delay:-1.3s"/>
    <circle class="nc-smoke" cx="260" cy="120" r="8"  style="animation-delay:-2.6s"/>
  </g>

  <!-- factory silhouette -->
  <g stroke="#2c3a66" stroke-width="2" fill="#0e1526">
    <rect x="238" y="148" width="36" height="140"/>
    <rect x="230" y="138" width="52" height="12" rx="2"/>
    <path d="M200,430 L200,280 L250,232 L300,280 L350,232 L400,280 L450,232
             L500,280 L550,232 L600,280 L650,232 L700,280 L700,430 Z"/>
    <rect x="700" y="350" width="100" height="80"/>
  </g>
  <circle class="nc-beacon" cx="256" cy="128" r="4.5" fill="#ff6b5e"/>

  <!-- neon sign -->
  <text class="nc-sign" x="462" y="330" text-anchor="middle">NIGHTCREW</text>

  <!-- windows -->
  <g fill="#e8b34b">
    <rect class="nc-w"    x="226" y="352" width="36" height="24" rx="3"/>
    <rect class="nc-w"    x="286" y="352" width="36" height="24" rx="3" style="animation-delay:-1.2s"/>
    <rect class="nc-woff" x="346" y="352" width="36" height="24" rx="3"/>
    <rect class="nc-w"    x="406" y="352" width="36" height="24" rx="3" style="animation-delay:-2.4s"/>
    <rect class="nc-w"    x="466" y="352" width="36" height="24" rx="3" style="animation-delay:-.6s"/>
    <rect class="nc-w"    x="526" y="352" width="36" height="24" rx="3" style="animation-delay:-1.8s"/>
    <rect class="nc-woff" x="586" y="352" width="36" height="24" rx="3" style="animation-delay:-3.4s"/>
    <rect class="nc-w"    x="646" y="352" width="36" height="24" rx="3" style="animation-delay:-2.9s"/>
    <rect class="nc-w"    x="226" y="392" width="36" height="24" rx="3" style="animation-delay:-.9s"/>
    <rect class="nc-woff" x="286" y="392" width="36" height="24" rx="3" style="animation-delay:-5.1s"/>
    <rect class="nc-w"    x="346" y="392" width="36" height="24" rx="3" style="animation-delay:-2.1s"/>
    <rect class="nc-w"    x="406" y="392" width="36" height="24" rx="3" style="animation-delay:-3.1s"/>
    <rect class="nc-w"    x="466" y="392" width="36" height="24" rx="3" style="animation-delay:-1.5s"/>
    <rect class="nc-woff" x="526" y="392" width="36" height="24" rx="3" style="animation-delay:-2.7s"/>
    <rect class="nc-w"    x="586" y="392" width="36" height="24" rx="3" style="animation-delay:-.3s"/>
    <rect class="nc-w"    x="646" y="392" width="36" height="24" rx="3" style="animation-delay:-4.2s"/>
    <rect class="nc-w"    x="724" y="382" width="30" height="48" rx="3" style="animation-delay:-1.1s"/>
  </g>

  <!-- conveyor -->
  <g clip-path="url(#ncspBeltClip)">
    <g class="nc-crates">
      <g stroke="rgba(232,179,75,.55)" stroke-width="1.5" fill="#1a2340">
        <rect x="-230" y="404" width="40" height="26" rx="3"/>
        <rect x="20"   y="404" width="40" height="26" rx="3"/>
        <rect x="270"  y="404" width="40" height="26" rx="3"/>
        <rect x="520"  y="404" width="40" height="26" rx="3"/>
        <rect x="770"  y="404" width="40" height="26" rx="3"/>
      </g>
      <g fill="#e8b34b" opacity=".8">
        <circle cx="-210" cy="417" r="2.5"/><circle cx="40" cy="417" r="2.5"/>
        <circle cx="290" cy="417" r="2.5"/><circle cx="540" cy="417" r="2.5"/>
        <circle cx="790" cy="417" r="2.5"/>
      </g>
    </g>
  </g>
  <rect x="90" y="432" width="720" height="10" rx="4" fill="#131b33" stroke="#263156" stroke-width="1.5"/>
  <g stroke="#3a477a" stroke-width="2" fill="#0e1526">
    <g class="nc-wheel"><circle cx="130" cy="450" r="8"/><path d="M130,442 v16 M122,450 h16"/></g>
    <g class="nc-wheel" style="animation-delay:-.6s"><circle cx="290" cy="450" r="8"/><path d="M290,442 v16 M282,450 h16"/></g>
    <g class="nc-wheel" style="animation-delay:-1.2s"><circle cx="450" cy="450" r="8"/><path d="M450,442 v16 M442,450 h16"/></g>
    <g class="nc-wheel" style="animation-delay:-1.8s"><circle cx="610" cy="450" r="8"/><path d="M610,442 v16 M602,450 h16"/></g>
    <g class="nc-wheel" style="animation-delay:-.9s"><circle cx="770" cy="450" r="8"/><path d="M770,442 v16 M762,450 h16"/></g>
  </g>
  <line x1="50" y1="462" x2="850" y2="462" stroke="#1b2444" stroke-width="2"/>

  <!-- low fog -->
  <rect x="0" y="370" width="900" height="130" fill="url(#ncspFog)"/>
</svg>
<p class="nc-tag">the night crew is on it</p>
<p class="nc-hint">click to skip</p>
</div>
<script>
(function () {
  "use strict";
  var splash = document.getElementById("nc-splash");
  var embed = !!window.NC_EMBED;
  try {
    if (embed && sessionStorage.getItem("ncSplash")) { splash.remove(); return; }
    if (embed) sessionStorage.setItem("ncSplash", "1");
  } catch (e) {}
  if (embed) {
    splash.classList.add("nc-embed");
    var done = false;
    var dismiss = function () {
      if (done) return;
      done = true;
      splash.style.opacity = "0";
      setTimeout(function () { splash.remove(); }, 650);
    };
    splash.addEventListener("click", dismiss);
    setTimeout(dismiss, 7000);
  }
})();
</script>
